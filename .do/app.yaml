name: arcli-prospect-intelligence
region: nyc

envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_SUPABASE_DATABASE_URL
  - key: REDIS_URL
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_REDIS_URL
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_OPENAI_API_KEY
  - key: INTERNAL_WORKER_SECRET
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_INTERNAL_WORKER_SECRET
  # Daily website crawl guard. Do not enable unlimited scans in production.
  - key: ARCLI_UNLIMITED_CRAWL_TEST_MODE
    scope: RUN_TIME
    type: general
    value: "false"
  # Public-source data is minimised before storage and removed after this
  # bounded period, including all copied lead-brief and research snapshots.
  - key: ARCLI_PUBLIC_DATA_RETENTION_DAYS
    scope: RUN_TIME
    type: general
    value: "30"
  # Only explicitly approved public provider adapters can persist content.
  - key: ARCLI_PUBLIC_SOURCE_ALLOWLIST
    scope: RUN_TIME
    type: general
    value: "hackernews,bluesky,stackexchange,github,lemmy,twitter"
  # Requires scripts/public_data_compliance_contract.sql. When enabled, a
  # completed removal request prevents the matching public item being re-added.
  - key: ARCLI_PUBLIC_DATA_GOVERNANCE_ENFORCEMENT
    scope: RUN_TIME
    type: general
    value: "true"
  - key: ARCLI_PRIVACY_REQUEST_RETENTION_DAYS
    scope: RUN_TIME
    type: general
    value: "90"

services:
  - name: arcli-api
    github:
      repo: sultsdftyuio/dataomen
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: ./Dockerfile
    run_command: uvicorn api.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    termination:
      drain_seconds: 15
      grace_period_seconds: 60

workers:
  - name: arcli-worker
    github:
      repo: sultsdftyuio/dataomen
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: ./Dockerfile
    # Equivalent to: dramatiq api.worker:broker -p 1 -t 8
    run_command: python scripts/start_worker.py
    instance_count: 1
    # Four times the RAM of basic-xxs gives the I/O-heavy matching worker
    # room for eight threads and avoids recycling during a normal scan.
    instance_size_slug: apps-s-1vcpu-2gb
    envs:
      - key: ARCLI_WORKER_BACKEND
        scope: RUN_TIME
        type: general
        value: dramatiq
      - key: ARCLI_DRAMATIQ_MODULES
        scope: RUN_TIME
        type: general
        value: api.worker
      - key: DRAMATIQ_PROCESSES
        scope: RUN_TIME
        type: general
        value: "1"
      - key: DRAMATIQ_THREADS
        scope: RUN_TIME
        type: general
        value: "8"
      - key: ARCLI_DRAMATIQ_QUEUE_PREFETCH
        scope: RUN_TIME
        type: general
        value: "16"
      - key: ARCLI_DRAMATIQ_DELAY_QUEUE_PREFETCH
        scope: RUN_TIME
        type: general
        value: "64"
      - key: ARCLI_DRAMATIQ_WORKER_TIMEOUT_MS
        scope: RUN_TIME
        type: general
        value: "5000"
      - key: ARCLI_REQUIRED_DRAMATIQ_VERSION
        scope: RUN_TIME
        type: general
        value: "2.2.0"
      - key: ARCLI_REDIS_MAX_CONNECTIONS
        scope: RUN_TIME
        type: general
        value: "32"
      # Eight worker threads share these bounded pools for short cache and
      # rate-limit transactions; this does not require a new database.
      - key: ARCLI_QUOTA_REDIS_MAX_CONNECTIONS
        scope: RUN_TIME
        type: general
        value: "12"
      - key: ARCLI_DB_POOL_SIZE
        scope: RUN_TIME
        type: general
        value: "8"
      - key: ARCLI_DB_MAX_OVERFLOW
        scope: RUN_TIME
        type: general
        value: "4"
      # New source posts share one OpenAI embeddings request per small batch.
      - key: ARCLI_SOURCE_POST_EMBEDDING_BATCH_SIZE
        scope: RUN_TIME
        type: general
        value: "16"
      - key: ARCLI_OPENAI_EMBEDDING_BATCH_SIZE
        scope: RUN_TIME
        type: general
        value: "32"
      # Prefer recall during source collection; only the verifier can mark a
      # post ready for review.
      - key: ARCLI_MATCHING_SIMILARITY_THRESHOLD
        scope: RUN_TIME
        type: general
        value: "0.15"
      - key: ARCLI_DISCOVERY_QUERY_OVERLAP_FRACTION
        scope: RUN_TIME
        type: general
        value: "0.10"
      - key: ARCLI_TECHNICAL_SOURCE_REQUIRE_TECHNICAL_QUERY
        scope: RUN_TIME
        type: general
        value: "false"
      - key: ARCLI_STRICT_BUYER_CONTEXT_FILTER
        scope: RUN_TIME
        type: general
        value: "false"
      # A verifier-confirmed relevant buyer problem should be visible for
      # review sooner; a human still decides whether to pursue it.
      - key: LEAD_VERIFIER_SCORE_THRESHOLD
        scope: RUN_TIME
        type: general
        value: "0.55"
      - key: LEAD_DISCOVERY_CANDIDATE_SCORE_THRESHOLD
        scope: RUN_TIME
        type: general
        value: "0.30"
      - key: ARCLI_GITHUB_DISCOVERY_QUERY_TERMS
        scope: RUN_TIME
        type: general
        value: "2"
      - key: ARCLI_STACKEXCHANGE_DISCOVERY_QUERY_TERMS
        scope: RUN_TIME
        type: general
        value: "2"
      # Recheck global cached posts later, after the fresh scan's batches have
      # made new leads available.
      - key: ARCLI_INITIAL_PUBLIC_REMATCH_DELAY_MS
        scope: RUN_TIME
        type: general
        value: "300000"
      # Arcli's pacing ceiling for verifier calls. OpenAI remains the authority:
      # any lower account/model limit is handled through the existing 429 retry
      # and backoff path.
      - key: ARCLI_OPENAI_CHAT_REQUESTS_PER_MINUTE
        scope: RUN_TIME
        type: general
        value: "500"
      # X requires a token with recent-search access.
      - key: ARCLI_X_INGESTION_ENABLED
        scope: RUN_TIME
        type: general
        value: "true"
      - key: ARCLI_WORKER_MAX_RSS_MB
        scope: RUN_TIME
        type: general
        value: "1536"
      - key: ARCLI_WORKER_MAX_RSS_GROWTH_MB
        scope: RUN_TIME
        type: general
        value: "768"
      - key: ARCLI_WORKER_MEMORY_CHECK_SECONDS
        scope: RUN_TIME
        type: general
        value: "15"
      - key: ARCLI_WORKER_MEMORY_GRACE_SECONDS
        scope: RUN_TIME
        type: general
        value: "90"
      - key: ARCLI_WORKER_MEMORY_GROWTH_SAMPLES
        scope: RUN_TIME
        type: general
        value: "3"
      - key: ARCLI_WORKER_RECYCLE_TIMEOUT_SECONDS
        scope: RUN_TIME
        type: general
        value: "360"
      - key: ARCLI_WORKER_SHUTDOWN_TIMEOUT_SECONDS
        scope: RUN_TIME
        type: general
        value: "330"
    termination:
      grace_period_seconds: 360

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: arcli-api

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
