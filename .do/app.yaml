name: arcli-prospect-intelligence
region: nyc

envs:
  - key: DATABASE_URL
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_SUPABASE_DATABASE_URL
  # Backend authentication validates Supabase-issued tokens through this
  # project URL. Set it again whenever a Supabase project is replaced.
  - key: SUPABASE_URL
    scope: RUN_TIME
    type: general
    value: REPLACE_WITH_SUPABASE_PROJECT_URL
  # Keep this server-only. The browser receives the separate publishable/anon
  # key through the frontend deployment, never this service-role credential.
  - key: SUPABASE_SERVICE_ROLE_KEY
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_SUPABASE_SERVICE_ROLE_KEY
  - key: REDIS_URL
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_REDIS_URL
  - key: OPENAI_API_KEY
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_OPENAI_API_KEY
  # Used only when the Crawl4AI browser cannot provide enough source content.
  # Set the real value in DigitalOcean; never commit it here.
  - key: FIRECRAWL_API_KEY
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_FIRECRAWL_API_KEY
  - key: INTERNAL_WORKER_SECRET
    scope: RUN_TIME
    type: secret
    value: REPLACE_WITH_INTERNAL_WORKER_SECRET
  # Daily website crawl guard. Do not enable unlimited scans in production.
  - key: ARCLI_UNLIMITED_CRAWL_TEST_MODE
    scope: RUN_TIME
    type: general
    value: "false"
  # Admission is enforced by the API before Pass 1, then the dedicated browser
  # worker consumes this bounded shared queue. During a sudden signup burst,
  # callers beyond this capacity receive a retryable 429 instead of creating
  # an hours-long Redis backlog or exhausting AI/browser providers.
  - key: ARCLI_CRAWL_MAX_QUEUED_JOBS
    scope: RUN_TIME
    type: general
    value: "6"
  - key: ARCLI_CRAWL_ADMISSION_RETRY_AFTER_SECONDS
    scope: RUN_TIME
    type: general
    value: "60"
  # Public-source data is minimised before storage and removed after this
  # bounded period, including all copied lead-brief and research snapshots.
  - key: ARCLI_PUBLIC_DATA_RETENTION_DAYS
    scope: RUN_TIME
    type: general
    value: "30"
  # Only explicitly approved public provider adapters can persist content.
  - key: ARCLI_PUBLIC_SOURCE_ALLOWLIST
    scope: RUN_TIME
    type: general
    value: "hackernews,bluesky,stackexchange,github,lemmy,twitter"
  # Requires scripts/public_data_compliance_contract.sql. When enabled, a
  # completed removal request prevents the matching public item being re-added.
  - key: ARCLI_PUBLIC_DATA_GOVERNANCE_ENFORCEMENT
    scope: RUN_TIME
    type: general
    value: "true"
  - key: ARCLI_PRIVACY_REQUEST_RETENTION_DAYS
    scope: RUN_TIME
    type: general
    value: "90"

services:
  - name: arcli-api
    github:
      repo: sultsdftyuio/dataomen
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: ./Dockerfile
    run_command: uvicorn api.main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    termination:
      drain_seconds: 15
      grace_period_seconds: 60

workers:
  - name: arcli-worker
    github:
      repo: sultsdftyuio/dataomen
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: ./Dockerfile
    # Equivalent to: dramatiq api.worker:broker -p 1 -t 8
    run_command: python scripts/start_worker.py
    instance_count: 1
    # Four times the RAM of basic-xxs gives the I/O-heavy matching worker
    # room for eight threads and avoids recycling during a normal scan.
    instance_size_slug: apps-s-1vcpu-2gb
    envs:
      - key: ARCLI_WORKER_BACKEND
        scope: RUN_TIME
        type: general
        value: dramatiq
      - key: ARCLI_DRAMATIQ_MODULES
        scope: RUN_TIME
        type: general
        value: api.worker
      - key: DRAMATIQ_PROCESSES
        scope: RUN_TIME
        type: general
        value: "1"
      - key: DRAMATIQ_THREADS
        scope: RUN_TIME
        type: general
        value: "8"
      # The dedicated Crawl4AI component owns the crawling queue. Keep this
      # normal worker on the remaining lightweight queues.
      - key: ARCLI_DRAMATIQ_QUEUES
        scope: RUN_TIME
        type: general
        value: "system,ingestion,embeddings,maintenance"
      - key: ARCLI_DRAMATIQ_QUEUE_PREFETCH
        scope: RUN_TIME
        type: general
        value: "16"
      - key: ARCLI_DRAMATIQ_DELAY_QUEUE_PREFETCH
        scope: RUN_TIME
        type: general
        value: "64"
      - key: ARCLI_DRAMATIQ_WORKER_TIMEOUT_MS
        scope: RUN_TIME
        type: general
        value: "5000"
      - key: ARCLI_REQUIRED_DRAMATIQ_VERSION
        scope: RUN_TIME
        type: general
        value: "2.2.0"
      - key: ARCLI_REDIS_MAX_CONNECTIONS
        scope: RUN_TIME
        type: general
        value: "32"
      # Firecrawl Free: one crawl request per minute and two browser slots.
      # Each Arcli website crawl can use both slots, so keep one active crawl
      # globally until the Firecrawl plan is upgraded.
      - key: ARCLI_FIRECRAWL_CRAWLS_PER_MINUTE
        scope: RUN_TIME
        type: general
        value: "1"
      - key: ARCLI_FIRECRAWL_ACTIVE_CRAWLS
        scope: RUN_TIME
        type: general
        value: "1"
      - key: ARCLI_FALLBACK_SCRAPE_CONCURRENCY
        scope: RUN_TIME
        type: general
        value: "1"
      # Eight worker threads share these bounded pools for short cache and
      # rate-limit transactions; this does not require a new database.
      - key: ARCLI_QUOTA_REDIS_MAX_CONNECTIONS
        scope: RUN_TIME
        type: general
        value: "12"
      - key: ARCLI_DB_POOL_SIZE
        scope: RUN_TIME
        type: general
        value: "8"
      - key: ARCLI_DB_MAX_OVERFLOW
        scope: RUN_TIME
        type: general
        value: "4"
      # New source posts share one OpenAI embeddings request per small batch.
      - key: ARCLI_SOURCE_POST_EMBEDDING_BATCH_SIZE
        scope: RUN_TIME
        type: general
        value: "16"
      - key: ARCLI_OPENAI_EMBEDDING_BATCH_SIZE
        scope: RUN_TIME
        type: general
        value: "32"
      # Prefer recall during source collection; only the verifier can mark a
      # post ready for review.
      - key: ARCLI_MATCHING_SIMILARITY_THRESHOLD
        scope: RUN_TIME
        type: general
        value: "0.20"
      - key: ARCLI_DISCOVERY_QUERY_OVERLAP_FRACTION
        scope: RUN_TIME
        type: general
        value: "0.15"
      - key: ARCLI_TECHNICAL_SOURCE_REQUIRE_TECHNICAL_QUERY
        scope: RUN_TIME
        type: general
        value: "true"
      - key: ARCLI_STRICT_BUYER_CONTEXT_FILTER
        scope: RUN_TIME
        type: general
        value: "false"
      # Preserve broad recall. The worker now ranks commercial, urgent, and
      # identifiable buyer signals before applying the bounded AI handoff.
      # A verifier-confirmed relevant buyer problem should be visible for
      # review sooner; a human still decides whether to pursue it.
      - key: LEAD_VERIFIER_SCORE_THRESHOLD
        scope: RUN_TIME
        type: general
        value: "0.55"
      - key: LEAD_DISCOVERY_CANDIDATE_SCORE_THRESHOLD
        scope: RUN_TIME
        type: general
        value: "0.30"
      - key: ARCLI_GITHUB_DISCOVERY_QUERY_TERMS
        scope: RUN_TIME
        type: general
        value: "2"
      - key: ARCLI_STACKEXCHANGE_DISCOVERY_QUERY_TERMS
        scope: RUN_TIME
        type: general
        value: "2"
      # Keep each activation focused on recent free, buyer-oriented sources.
      # The API can still run a broader research scan explicitly when needed.
      - key: ARCLI_HN_INGESTION_ENABLED
        scope: RUN_TIME
        type: general
        value: "true"
      - key: ARCLI_BLUESKY_INGESTION_ENABLED
        scope: RUN_TIME
        type: general
        value: "true"
      - key: ARCLI_LEMMY_INGESTION_ENABLED
        scope: RUN_TIME
        type: general
        value: "true"
      - key: ARCLI_GITHUB_INGESTION_ENABLED
        scope: RUN_TIME
        type: general
        value: "false"
      - key: ARCLI_STACKEXCHANGE_INGESTION_ENABLED
        scope: RUN_TIME
        type: general
        value: "false"
      - key: ARCLI_X_INGESTION_ENABLED
        scope: RUN_TIME
        type: general
        value: "false"
      - key: ARCLI_INITIAL_PUBLIC_INGESTION_QUERY_LIMIT
        scope: RUN_TIME
        type: general
        value: "6"
      - key: ARCLI_INITIAL_PUBLIC_INGESTION_QUERY_VARIANTS_PER_TYPE
        scope: RUN_TIME
        type: general
        value: "2"
      - key: ARCLI_INITIAL_PUBLIC_INGESTION_LOOKBACK_HOURS
        scope: RUN_TIME
        type: general
        # A new workspace has no historical corpus. Use the supported 90-day
        # first-pass window so low-volume buyer language is not mistaken for
        # a zero-demand market; the embedding caps below still bound cost.
        value: "2160"
      - key: ARCLI_INITIAL_PUBLIC_INGESTION_POSTS_PER_QUERY
        scope: RUN_TIME
        type: general
        value: "15"
      - key: ARCLI_ADDITIONAL_PUBLIC_SOURCE_MAX_PAGES
        scope: RUN_TIME
        type: general
        value: "1"
      # Bound the fresh posts an activation can send to OpenAI. Excluded posts
      # remain in source storage, while the run telemetry records the limit.
      - key: ARCLI_INITIAL_PUBLIC_EMBEDDING_POST_LIMIT
        scope: RUN_TIME
        type: general
        value: "60"
      - key: ARCLI_INITIAL_PUBLIC_EMBEDDING_POSTS_PER_SOURCE_LIMIT
        scope: RUN_TIME
        type: general
        value: "20"
      # The discovery worker owns raw -> plausible -> review candidate state.
      # It is explicit here so a new deployment cannot silently omit the
      # candidate-first funnel after its database contract is installed.
      - key: ARCLI_DISCOVERY_CANDIDATE_POOL_ENABLED
        scope: RUN_TIME
        type: general
        value: "true"
      - key: ARCLI_INITIAL_PUBLIC_REMATCH_ENABLED
        scope: RUN_TIME
        type: general
        value: "false"
      # Used only when ARCLI_INITIAL_PUBLIC_REMATCH_ENABLED is true.
      - key: ARCLI_INITIAL_PUBLIC_REMATCH_DELAY_MS
        scope: RUN_TIME
        type: general
        value: "120000"
      # Discovery stays open for at least two minutes, and at most five, while
      # it waits for three verifier-confirmed items for the review queue.
      - key: ARCLI_INITIAL_PUBLIC_DISCOVERY_TARGET_READY
        scope: RUN_TIME
        type: general
        value: "3"
      - key: ARCLI_INITIAL_PUBLIC_DISCOVERY_MIN_SECONDS
        scope: RUN_TIME
        type: general
        value: "120"
      - key: ARCLI_INITIAL_PUBLIC_DISCOVERY_MAX_SECONDS
        scope: RUN_TIME
        type: general
        value: "300"
      - key: ARCLI_INITIAL_PUBLIC_DISCOVERY_POLL_SECONDS
        scope: RUN_TIME
        type: general
        value: "15"
      # Arcli's pacing ceiling for verifier calls. OpenAI remains the authority:
      # any lower account/model limit is handled through the existing 429 retry
      # and backoff path.
      - key: ARCLI_OPENAI_CHAT_REQUESTS_PER_MINUTE
        scope: RUN_TIME
        type: general
        value: "500"
      - key: ARCLI_WORKER_MAX_RSS_MB
        scope: RUN_TIME
        type: general
        value: "1536"
      - key: ARCLI_WORKER_MAX_RSS_GROWTH_MB
        scope: RUN_TIME
        type: general
        value: "768"
      - key: ARCLI_WORKER_MEMORY_CHECK_SECONDS
        scope: RUN_TIME
        type: general
        value: "15"
      - key: ARCLI_WORKER_MEMORY_GRACE_SECONDS
        scope: RUN_TIME
        type: general
        value: "90"
      - key: ARCLI_WORKER_MEMORY_GROWTH_SAMPLES
        scope: RUN_TIME
        type: general
        value: "3"
      - key: ARCLI_WORKER_RECYCLE_TIMEOUT_SECONDS
        scope: RUN_TIME
        type: general
        value: "360"
      - key: ARCLI_WORKER_SHUTDOWN_TIMEOUT_SECONDS
        scope: RUN_TIME
        type: general
        value: "330"
    termination:
      grace_period_seconds: 360

  # Browser work is isolated from matching and discovery. It starts on 2 GB
  # for the early stage, therefore one process, one thread, one active
  # Chromium crawl, and no more than four profile pages are deliberate.
  - name: crawl4ai-worker
    github:
      repo: sultsdftyuio/dataomen
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: ./Crawl4AI/Dockerfile
    run_command: python scripts/start_worker.py
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    # Workers are not routed publicly. This endpoint is only for App Platform
    # liveness probing and reports healthy after the supervised child is alive.
    liveness_health_check:
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
      http_path: /health
      port: 8080
    envs:
      - key: ARCLI_WORKER_BACKEND
        scope: RUN_TIME
        type: general
        value: dramatiq
      - key: ARCLI_WORKER_HEALTH_PORT
        scope: RUN_TIME
        type: general
        value: "8080"
      - key: ARCLI_DRAMATIQ_MODULES
        scope: RUN_TIME
        type: general
        value: api.worker
      - key: ARCLI_DRAMATIQ_QUEUES
        scope: RUN_TIME
        type: general
        value: "crawling,workspace-brain"
      - key: DRAMATIQ_PROCESSES
        scope: RUN_TIME
        type: general
        value: "1"
      - key: DRAMATIQ_THREADS
        scope: RUN_TIME
        type: general
        value: "1"
      - key: ARCLI_DRAMATIQ_QUEUE_PREFETCH
        scope: RUN_TIME
        type: general
        value: "1"
      - key: ARCLI_DRAMATIQ_DELAY_QUEUE_PREFETCH
        scope: RUN_TIME
        type: general
        value: "8"
      - key: ARCLI_DRAMATIQ_WORKER_TIMEOUT_MS
        scope: RUN_TIME
        type: general
        value: "5000"
      - key: ARCLI_REQUIRED_DRAMATIQ_VERSION
        scope: RUN_TIME
        type: general
        value: "2.2.0"
      - key: ARCLI_REDIS_MAX_CONNECTIONS
        scope: RUN_TIME
        type: general
        value: "8"
      - key: ARCLI_QUOTA_REDIS_MAX_CONNECTIONS
        scope: RUN_TIME
        type: general
        value: "4"
      - key: ARCLI_CRAWL4AI_ENABLED
        scope: RUN_TIME
        type: general
        value: "true"
      - key: ARCLI_CRAWL4AI_ACTIVE_CRAWLS
        scope: RUN_TIME
        type: general
        value: "1"
      - key: ARCLI_CRAWL4AI_PAGE_TIMEOUT_MS
        scope: RUN_TIME
        type: general
        value: "20000"
      - key: ARCLI_CRAWL4AI_MIN_CONTENT_CHARS
        scope: RUN_TIME
        type: general
        value: "700"
      - key: ARCLI_CRAWL_MAX_PAGES
        scope: RUN_TIME
        type: general
        value: "4"
      # Firecrawl remains the fallback and retains its Free-plan guardrails.
      - key: ARCLI_FIRECRAWL_CRAWLS_PER_MINUTE
        scope: RUN_TIME
        type: general
        value: "1"
      - key: ARCLI_FIRECRAWL_ACTIVE_CRAWLS
        scope: RUN_TIME
        type: general
        value: "1"
      - key: ARCLI_FALLBACK_SCRAPE_CONCURRENCY
        scope: RUN_TIME
        type: general
        value: "1"
      - key: ARCLI_WORKER_MAX_RSS_MB
        scope: RUN_TIME
        type: general
        value: "1400"
      - key: ARCLI_WORKER_MAX_RSS_GROWTH_MB
        scope: RUN_TIME
        type: general
        value: "700"
      - key: ARCLI_WORKER_MEMORY_CHECK_SECONDS
        scope: RUN_TIME
        type: general
        value: "15"
      - key: ARCLI_WORKER_MEMORY_GRACE_SECONDS
        scope: RUN_TIME
        type: general
        value: "90"
      - key: ARCLI_WORKER_MEMORY_GROWTH_SAMPLES
        scope: RUN_TIME
        type: general
        value: "3"
      - key: ARCLI_WORKER_RECYCLE_TIMEOUT_SECONDS
        scope: RUN_TIME
        type: general
        value: "360"
      - key: ARCLI_WORKER_SHUTDOWN_TIMEOUT_SECONDS
        scope: RUN_TIME
        type: general
        value: "330"
    termination:
      grace_period_seconds: 360

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: arcli-api

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
